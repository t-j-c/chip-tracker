name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/backend

      - name: Build
        run: dotnet build src/backend --configuration Release --no-restore

      - name: Test
        run: dotnet test src/backend --configuration Release --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint
        run: npm run lint
        working-directory: src/frontend

      - name: Test
        run: npm run test
        working-directory: src/frontend

      - name: Build
        run: npm run build
        working-directory: src/frontend
        env:
          VITE_API_URL: ""

  infra-plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      # Proves the ReadyToRun linux-arm64 bundles build on the runner, and gives synth real assets.
      - name: Publish Lambda bundles
        shell: pwsh
        run: ./scripts/publish-lambdas.ps1

      - name: Install dependencies
        run: npm ci
        working-directory: infra

      - name: Build TypeScript
        run: npm run build
        working-directory: infra

      - name: Test
        run: npm test
        working-directory: infra

      - name: CDK Synth
        run: npx cdk synth -c alertEmail=ci@example.com
        working-directory: infra

      # Only the diff needs AWS access; fork PRs have no secrets, so it is best-effort.
      - name: Setup AWS credentials
        id: aws
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: CDK Diff
        if: ${{ steps.aws.outcome == 'success' }}
        run: npx cdk diff chip-tracker-prod -c alertEmail="${{ vars.ALERT_EMAIL }}"
        working-directory: infra
        continue-on-error: true

  e2e:
    # Full local stack (Docker Compose) with Playwright. Slow, so it runs only when the PR has the "run-e2e" label.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run e2e
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
